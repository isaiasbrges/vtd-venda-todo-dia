name: Verificar projeto

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  sqlite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar JavaScript
        run: |
          node --check app.js
          node --check master.js
          node --check data.js
          node --check finance-ui.js
          node --check assets/landing/black-friday.js
          node tools/landing/sync-pages.cjs --check
      - name: Executar testes PHP
        run: php tests/run_all_tests.php
      - name: Verificar fluxos do frontend
        run: node --test tests/frontend.test.cjs tests/finance-ui.test.cjs

  mysql:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: test-only-password
          MYSQL_DATABASE: vtd_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ptest-only-password"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      DB_DRIVER: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: vtd_test
      DB_USERNAME: root
      DB_PASSWORD: test-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_mysql
      - name: Verificar instalação e operações do Master no MySQL
        run: php -d zend.assertions=1 -d assert.exception=1 tests/test_master_integrations.php

      - name: Verificar cartões e faturas no MySQL
        env:
          VTD_CARDS_TEST_MYSQL: '1'
        run: php -d zend.assertions=1 -d assert.exception=1 tests/test_finance_cards.php
